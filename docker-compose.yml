services:
  backend:
    build:
      context: .
      dockerfile: back-end/Dockerfile
    container_name: cultura-digital-backend
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - CHATBOT_URL=http://chatbot-api:8000
      - SPRING_PROFILES_ACTIVE=prod
      # Permite origens do Angular (local na 4200, Docker/Nginx na 80/4200):
      - CORS_ALLOWED_ORIGINS=http://localhost:4200,http://127.0.0.1:4200,http://localhost:80,http://localhost
    networks:
      - cultura-network
    depends_on:
      - chatbot-api
    restart: unless-stopped

  # =========================================================================
  # Serviço Frontend (Angular)
  # =========================================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cultura-digital-frontend
    ports:
      - "4200:80"
      - "80:80"
    depends_on:
      - backend
    networks:
      - cultura-network
    restart: unless-stopped

  chatbot-api:
    build:
      context: .
      dockerfile: chatbot/Dockerfile.api
    container_name: cultura-digital-chatbot-api
    env_file:
      - ./chatbot/.env
    environment:
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
    networks:
      - cultura-network
    restart: unless-stopped

networks:
  cultura-network:
    driver: bridge
