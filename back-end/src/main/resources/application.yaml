spring:
  application:
    name: cultura-digital

server:
  port: ${SERVER_PORT:8080}

frontend:
  url: ${FRONTEND_URL:http://localhost:4200}

chatbot:
  url: ${CHATBOT_URL:http://localhost:8000}

cors:
  # Origens aceitas (Angular local em 4200, Nginx em 80, e IPs de loopback)
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:80,http://localhost}
